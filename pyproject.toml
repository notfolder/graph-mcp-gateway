[project]
name = "graph-mcp-gateway"
version = "0.1.0"
description = "ms-365-mcp-server を FastMCP の OAuth プロキシで中継する社内共有 MCP サーバー（PoC）"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastmcp[azure]==4.1.4",
    "aiohttp",
    "py-key-value-aio[redis]",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graph_mcp_gateway", "external/open-webui/src/openwebui_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["tests"]
